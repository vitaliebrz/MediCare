<!doctype html>
<html lang="ro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#14b8a6">
    <title>MediCare – fără internet</title>
    <!-- Pagina arătată de service worker (public/sw.js) când nu e internet. E independentă:
         fără CSS sau fonturi de pe server, pentru că acestea nu se pot încărca offline. -->
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
            padding: 16px; background: #f8fafc; color: #0f172a;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        main {
            width: 100%; max-width: 380px; text-align: center; background: #fff;
            border: 1px solid #e2e8f0; border-radius: 12px; padding: 32px 24px;
        }
        img { width: 64px; height: 64px; border-radius: 14px; }
        h1 { font-size: 20px; margin: 16px 0 8px; }
        p { color: #64748b; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
        button {
            background: #14b8a6; color: #fff; border: 0; border-radius: 8px;
            padding: 10px 18px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        button:hover { background: #0d9488; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="MediCare">
        <h1>Nu ești conectat la internet</h1>
        <p>MediCare are nevoie de internet ca să încarce pacienții și programările. Pagina se reîncarcă singură când revine conexiunea.</p>
        <button type="button" onclick="location.reload()">Încearcă din nou</button>
    </main>
    <script>
        // Când revine internetul, reîncărcăm pagina pe care voia s-o deschidă utilizatorul
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
